# Local infrastructure for verifix. Only Postgres for now - the sandbox image for
# running repository tests arrives in M5 and is NOT a long-running service.
services:
  postgres:
    image: postgres:17-alpine
    container_name: verifix-postgres
    environment:
      POSTGRES_USER: verifix
      POSTGRES_PASSWORD: verifix_dev
      POSTGRES_DB: verifix
    ports:
      # Bound to localhost only: the database is never reachable from the LAN.
      - "127.0.0.1:5434:5432"
    volumes:
      - verifix_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifix -d verifix"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  verifix_pgdata:
