[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is deliberately not set here: alembic/env.py reads VERIFIX_DATABASE_URL
# from the environment / .env, so credentials live in one place only.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
